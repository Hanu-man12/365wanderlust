<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>365 Wanderlust | Grab Your Leisure</title>
    <meta name="description" content="Explore Rajasthan with 365 Wanderlust. Curated travel experiences to Jaipur, Jodhpur, Udaipur, Pushkar and the Thar Desert. WhatsApp us to plan your journey." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://365wanderlust.com/" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://365wanderlust.com/" />
    <meta property="og:title"       content="365 Wanderlust | Grab Your Leisure" />
    <meta property="og:description" content="Curated travel experiences across Rajasthan. Jaipur, Jodhpur, Udaipur, Pushkar and the Thar Desert. Grab Your Leisure." />
    <meta property="og:image"       content="https://365wanderlust.com/og-image.jpg" />
    <meta property="og:site_name"   content="365 Wanderlust" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="365 Wanderlust | Grab Your Leisure" />
    <meta name="twitter:description" content="Curated Rajasthan travel. Jaipur, Jodhpur, Udaipur, Pushkar, Thar Desert. Grab Your Leisure." />
    <meta name="twitter:image"       content="https://365wanderlust.com/og-image.jpg" />

    <!-- ── Theme & Brand ── -->
    <!-- theme-color updated to match new crimson brand token #D0112B -->
    <meta name="theme-color" content="#D0112B" />
    <meta name="application-name" content="365 Wanderlust" />

    <!-- ── Favicons ──
         Using logo-mark.png directly as the favicon source.
         ⚠️  NOTE: logo-mark.png currently has a WHITE background baked into
         the PNG file itself. To get a clean transparent favicon, please supply
         a transparent-background version of the logo at:
           public/logo-mark.png  (replacing the current white-bg version)
         The SVG favicon below is a clean vector fallback (crimson compass).
         For PNG favicons, place 32x32 and 180x180 exports of the logo at:
           public/favicon-32x32.png
           public/apple-touch-icon.png
         ALL references (favicon, apple-touch-icon, navbar, footer) use the
         SAME single file: public/logo-mark.png — replace once, updates everywhere.
    ──-->
    <link rel="icon" type="image/png"     href="/logo-mark.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-mark.png" />

    <!-- ── JSON-LD Structured Data (TravelAgency) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "365 Wanderlust",
      "url": "https://365wanderlust.com",
      "telephone": "+917605809599",
      "email": "grabyourleisure365@gmail.com",
      "description": "Curated Rajasthan travel experiences — Jaipur, Jodhpur, Udaipur, Pushkar, Thar Desert.",
      "areaServed": {
        "@type": "State",
        "name": "Rajasthan",
        "addressCountry": "IN"
      },
      "slogan": "Grab Your Leisure"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
