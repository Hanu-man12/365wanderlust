<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>Grab Your Leisure</title>
    <meta name="description" content="365 Wanderlust — Grab Your Leisure. Curated travel experiences across India and the world — Bengal, Rajasthan, Himalayas, South East Asia and beyond. WhatsApp us to plan your journey." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://365wanderlust.com/" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://365wanderlust.com/" />
    <meta property="og:title"       content="365 Wanderlust | Grab Your Leisure" />
    <meta property="og:description" content="Curated travel experiences across India and the world — Bengal, Rajasthan, Himalayas, South East Asia and beyond. Grab Your Leisure with 365 Wanderlust." />
    <meta property="og:image"       content="https://365wanderlust.com/og-image.jpg" />
    <meta property="og:site_name"   content="365 Wanderlust" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="365 Wanderlust | Grab Your Leisure" />
    <meta name="twitter:description" content="Bengal, Rajasthan, Himalayas, South East Asia and beyond. Curated world travel experiences by 365 Wanderlust. Grab Your Leisure." />
    <meta name="twitter:image"       content="https://365wanderlust.com/og-image.jpg" />

    <!-- ── Theme & Brand ── -->
    <!-- theme-color updated to match new crimson brand token #D0112B -->
    <meta name="theme-color" content="#D0112B" />
    <meta name="application-name" content="365 Wanderlust" />

    <!-- ── Favicon — favicon.png is the ONLY tab icon source ──
         Replace public/favicon.png → updates tab icon instantly.
    ──-->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- ── JSON-LD Structured Data (TravelAgency) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "365 Wanderlust",
      "url": "https://365wanderlust.com",
      "telephone": "+917605809599",
      "email": "grabyourleisure365@gmail.com",
      "description": "Curated travel experiences across India and the world — Bengal, Rajasthan, Himalayas, Uttarakhand, Odisha, North East India, South East Asia and beyond.",
      "areaServed": [
        { "@type": "Country", "name": "India" },
        { "@type": "State",   "name": "Rajasthan",        "addressCountry": "IN" },
        { "@type": "State",   "name": "West Bengal",      "addressCountry": "IN" },
        { "@type": "State",   "name": "Uttarakhand",      "addressCountry": "IN" },
        { "@type": "State",   "name": "Himachal Pradesh", "addressCountry": "IN" },
        { "@type": "Country", "name": "Thailand" },
        { "@type": "Country", "name": "Vietnam" }
      ],
      "slogan": "Grab Your Leisure"
    }
    </script>
    <!-- ── Theme: apply saved preference BEFORE paint to avoid flash ──
         Reads localStorage 'theme'. If 'dark' → adds .dark to <html>.
         Must be inline (not deferred) so it runs synchronously before
         any CSS or React renders, preventing a white flash on refresh. -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('365w-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
